services:
  oot:
    container_name: oot
    image: ghcr.io/helv-io/oot2-tracker:latest
    restart: always
    network_mode: web
    environment:
      - TZ=America/New_York
      - PUBLIC_URL=https://oot.helv.io
      - PORT=8080
      - DB_PATH=/data/oot.sqlite
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      - /docker/oot:/data
    healthcheck:
      test: ["CMD", "node", "server/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.services.oot.loadbalancer.server.port=8080
      - traefik.http.routers.oot.rule=Host(`oot.helv.io`)
      - traefik.http.routers.oot.entryPoints=websecure
      - traefik.http.routers.oot.service=oot
