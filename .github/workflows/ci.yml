# Type-check, test and build on every push and pull request, plus a
# Docker build (not pushed) so a broken Dockerfile fails before a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image and smoke-test it
        run: |
          docker build -t oot2-tracker:ci .
          docker run -d --name oot -p 8080:8080 -e PUBLIC_URL=http://localhost:8080 -e DB_PATH=/tmp/oot.sqlite oot2-tracker:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'
          docker exec oot node server/healthcheck.js

  e2e:
    name: motion e2e
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install Playwright browsers
        run: |
          npm i --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
